services:
  - type: web
    name: vrip-backend
    runtime: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: SEED_ON_STARTUP
        value: true
      - key: PYTHON_VERSION
        value: 3.12.0

databases:
  - name: vrip-db
    plan: free
    region: singapore
    databaseName: vendor_db
    user: vrip_user
