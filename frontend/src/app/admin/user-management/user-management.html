<div class="page-container">
    <div class="page-vrip-page-header" style="margin-bottom: var(--vrip-space-6);">
        <h1 class="vrip-page-title">User Management</h1>
        <p>Approve new signups and manage account access.</p>
    </div>

    <app-card [noPadding]="true">
        <app-table>
            <ng-container table-header>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th style="text-align: right;">Actions</th>
                </tr>
            </ng-container>
            <ng-container table-body>
                <tr *ngFor="let user of users">
                    <td>{{ user.id }}</td>
                    <td>{{ user.name }}</td>
                    <td>{{ user.email }}</td>
                    <td>{{ user.role }}</td>
                    <td>{{ user.status }}</td>
                    <td style="text-align: right;">
                        <app-button variant="ghost" *ngIf="user.status === 'Pending Approval'" (onClick)="approveUser(user)">Approve</app-button>
                        <app-button variant="ghost" (onClick)="blockUser(user)">Block</app-button>
                        <app-button variant="ghost" (onClick)="deactivateUser(user)">Deactivate</app-button>
                        <app-button variant="ghost" (onClick)="deleteUser(user)">Delete</app-button>
                    </td>
                </tr>
            </ng-container>
        </app-table>
    </app-card>
</div>
