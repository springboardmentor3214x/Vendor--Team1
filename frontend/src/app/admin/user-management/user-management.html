<div class="page-container">
    <div class="vrip-page-header" style="margin-bottom: var(--v-6);">
        <div>
            <h1 class="vrip-page-title">User Management</h1>
            <p class="vrip-page-subtitle">Approve new signups and manage account access.</p>
        </div>
    </div>

    <app-card [noPadding]="true">
        <div class="vrip-table-wrapper">
            <table class="vrip-table">
                <thead>
                    <tr>
                        <th style="width:50px;">ID</th>
                        <th style="min-width:140px;">Name</th>
                        <th style="min-width:200px;">Email</th>
                        <th style="min-width:160px;">Role</th>
                        <th style="width:100px;">Status</th>
                        <th style="width:220px; text-align:right;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let user of users" class="vrip-table-row">
                        <td><span class="vendor-id-badge">{{ user.id }}</span></td>
                        <td><span class="user-name">{{ user.name }}</span></td>
                        <td><span class="email-cell">{{ user.email }}</span></td>
                        <td>
                            <span class="role-badge">{{ user.role }}</span>
                        </td>
                        <td>
                            <app-badge [variant]="user.status === 'Active' ? 'success' : user.status === 'Blocked' ? 'danger' : 'warning'">
                                {{ user.status }}
                            </app-badge>
                        </td>
                        <td style="text-align:right;">
                            <div class="action-buttons" style="justify-content:flex-end;">
                                <app-button
                                    *ngIf="user.status !== 'Active'"
                                    variant="success" size="sm"
                                    iconLeft="check_circle"
                                    (onClick)="approveUser(user)">
                                    Approve
                                </app-button>
                                <app-button
                                    *ngIf="user.status === 'Active'"
                                    variant="warning" size="sm"
                                    iconLeft="block"
                                    (onClick)="blockUser(user)">
                                    Block
                                </app-button>
                                <app-button
                                    *ngIf="user.status === 'Active'"
                                    variant="outline" size="sm"
                                    iconLeft="person_off"
                                    (onClick)="deactivateUser(user)">
                                    Deactivate
                                </app-button>
                                <app-button
                                    variant="ghost" size="sm"
                                    iconLeft="delete"
                                    (onClick)="deleteUser(user)">
                                </app-button>
                            </div>
                        </td>
                    </tr>
                    <tr *ngIf="users.length === 0">
                        <td colspan="6" class="vrip-table-empty">
                            <div class="empty-state">
                                <span class="material-symbols-outlined empty-icon">people</span>
                                <p>No users found</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </app-card>
</div>
