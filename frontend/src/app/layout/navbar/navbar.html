<header class="vrip-navbar">
  <div class="vrip-navbar-left">
      <h1 class="vrip-navbar-title">{{ pageTitle || 'Vendor Reliability Intelligence Platform' }}</h1>
  </div>

  <div class="vrip-navbar-right">

      <div class="vrip-navbar-search">
        <app-search placeholder="Global search..."></app-search>
      </div>

      <button class="vrip-icon-btn" routerLink="/admin/notifications">
          <span class="material-symbols-outlined">notifications</span>
          <span class="vrip-notification-dot"></span>
      </button>

      <div class="vrip-divider-vertical"></div>

      <div class="vrip-profile-wrapper">
          <div class="vrip-profile-menu" (click)="toggleMenu($event)">
              <div class="vrip-avatar">
                  {{ avatarInitial }}
              </div>
              <div class="vrip-profile-info">
                  <h4>{{ fullName }}</h4>
                  <p>{{ role || 'User' }}</p>
              </div>
              <span class="material-symbols-outlined vrip-dropdown-icon">expand_more</span>
          </div>

          <div class="vrip-dropdown-menu" *ngIf="isMenuOpen">
              <a routerLink="/profile" (click)="isMenuOpen = false" class="vrip-dropdown-item">
                  <span class="material-symbols-outlined">account_circle</span>
                  <span>My Profile</span>
              </a>
              <a routerLink="/settings" (click)="isMenuOpen = false" class="vrip-dropdown-item">
                  <span class="material-symbols-outlined">settings</span>
                  <span>Settings</span>
              </a>
              <div class="vrip-dropdown-divider"></div>
              <button (click)="logout()" class="vrip-dropdown-item logout-btn">
                  <span class="material-symbols-outlined">logout</span>
                  <span>Logout</span>
              </button>
          </div>
      </div>

  </div>
</header>
