<div class="page-container">
    <div class="page-vrip-page-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--vrip-space-6);">
        <div>
            <h1 class="vrip-page-title">System Audit Logs</h1>
            <p>Immutable record of all critical platform activities.</p>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
            <input type="text" placeholder="Search user, action, record or IP..."
                   [(ngModel)]="searchText" (input)="applySearch()"
                   style="padding: 9px 12px; border-radius: 6px; border: 1px solid var(--border-color); min-width: 260px;" />
            <select [(ngModel)]="selectedModule" (change)="onModuleChange()"
                    style="padding: 9px 12px; border-radius: 6px; border: 1px solid var(--border-color);">
                <option *ngFor="let m of modules" [value]="m">{{ m }}</option>
            </select>
            <app-button variant="outline" iconLeft="refresh" (onClick)="loadLogs()">Refresh</app-button>
        </div>
    </div>

</div>
