<div class="page-container" style="height: calc(100vh - 120px); display: flex; flex-direction: column;">
    <div class="vrip-page-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--v-4, 16px);">
        <div>
            <h1 class="vrip-page-title">Communication</h1>
            <p class="vrip-page-subtitle">Direct messaging with the Procurement Team.</p>
        </div>
        <app-button variant="outline" size="sm" iconLeft="refresh" (onClick)="loadMessages()">Refresh Chat</app-button>
    </div>

    <app-card [noPadding]="true" style="flex: 1; display: flex; flex-direction: column; overflow: hidden; border-radius: 12px;">
        <div style="padding: 16px 24px; border-bottom: 1px solid var(--v-border, #e5e7eb); background: var(--v-bg-card, #ffffff); display: flex; align-items: center; gap: 12px;">
            <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--v-brand-light, #ebe9fe); color: var(--v-brand, #635bff); display: flex; align-items: center; justify-content: center;">
                <span class="material-symbols-outlined">support_agent</span>
            </div>
            <div>
                <h3 style="margin: 0; font-size: 0.95rem; font-weight: 600;">Procurement Helpdesk</h3>
                <span style="font-size: 0.75rem; color: var(--v-success, #10b981);">• Active Channel</span>
            </div>
        </div>
        
        <div style="flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; background: var(--v-bg-body, #f8fafc);">
            
            <div *ngIf="loading" style="display: flex; flex-direction: column; gap: 16px;">
                <div style="align-self: flex-start; width: 50%;">
                    <div class="skeleton-cell" style="height: 48px; border-radius: 12px;"></div>
                    <div class="skeleton-text" style="width: 30%; margin-top: 4px;"></div>
                </div>
                <div style="align-self: flex-end; width: 50%;">
                    <div class="skeleton-cell" style="height: 48px; border-radius: 12px;"></div>
                    <div class="skeleton-text" style="width: 30%; margin-top: 4px; margin-left: auto; display: block;"></div>
                </div>
                <div style="align-self: flex-start; width: 40%;">
                    <div class="skeleton-cell" style="height: 40px; border-radius: 12px;"></div>
                    <div class="skeleton-text" style="width: 30%; margin-top: 4px;"></div>
                </div>
            </div>

            <ng-container *ngIf="!loading">
                <div *ngFor="let msg of messages" [style.align-self]="msg.isSelf ? 'flex-end' : 'flex-start'" style="max-width: 70%;">
                    <div [style.background]="msg.isSelf ? 'var(--v-brand, #635bff)' : 'white'"
                         [style.color]="msg.isSelf ? 'white' : 'var(--v-text-primary, #111827)'"
                         style="padding: 12px 16px; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); border: 1px solid var(--v-border, #e5e7eb);">
                        <span *ngIf="!msg.isSelf" style="font-size: 0.7rem; font-weight: 600; color: var(--v-brand, #635bff); display: block; margin-bottom: 2px;">{{ msg.sender }}</span>
                        <p style="margin: 0; font-size: 0.875rem; line-height: 1.4;">{{ msg.content }}</p>
                    </div>
                    <span [style.text-align]="msg.isSelf ? 'right' : 'left'" style="font-size: 0.7rem; color: var(--v-text-tertiary, #9ca3af); margin-top: 4px; display: block;">{{ msg.timestamp }}</span>
                </div>

                <div *ngIf="messages.length === 0" style="text-align: center; padding: 40px; color: var(--v-text-secondary);">
                    <span class="material-symbols-outlined" style="font-size: 36px; color: var(--v-text-tertiary);">chat_bubble_outline</span>
                    <p style="margin-top: 8px;">No message history. Type a message below to start communicating.</p>
                </div>
            </ng-container>

        </div>

        <div style="padding: 16px; border-top: 1px solid var(--v-border, #e5e7eb); display: flex; gap: 12px; background: white;">
            <input type="text" [(ngModel)]="newMessage" (keyup.enter)="sendMessage()" placeholder="Type a message..." style="flex: 1; padding: 10px 16px; border: 1px solid var(--v-border, #e5e7eb); border-radius: 20px; outline: none; font-family: inherit; font-size: 0.875rem;">
            <app-button variant="primary" iconLeft="send" (onClick)="sendMessage()">Send</app-button>
        </div>
    </app-card>
</div>
