<div class="page-container">
    <div class="vrip-page-header" style="margin-bottom: var(--v-6, 24px);">
        <h1 class="vrip-page-title">Account Settings</h1>
        <p class="vrip-page-subtitle">Manage your preferences, security, and notifications.</p>
    </div>

    <div class="settings-layout">
        <!-- Sidebar Navigation -->
        <div class="settings-nav">
            <div class="settings-nav-item active">General Preferences</div>
            <div class="settings-nav-item">Security & Password</div>
            <div class="settings-nav-item">Notifications</div>
            <div class="settings-nav-item">Appearance</div>
        </div>

        <!-- Settings Content -->
        <div style="display: flex; flex-direction: column; gap: var(--v-6, 24px);">
            <app-card>
                <h2 style="margin: 0 0 20px 0; font-size: 1.125rem; font-weight: 600;">General Preferences</h2>
                
                <div class="settings-form-grid">
                    <div class="form-group">
                        <label for="setting-lang">Language</label>
                        <select id="setting-lang" class="vrip-select">
                            <option>English (US)</option>
                            <option>Spanish</option>
                            <option>French</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="setting-tz">Timezone</label>
                        <select id="setting-tz" class="vrip-select">
                            <option>(GMT-05:00) Eastern Time</option>
                            <option>(GMT-08:00) Pacific Time</option>
                            <option>(GMT+00:00) UTC</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="setting-date">Date Format</label>
                        <select id="setting-date" class="vrip-select">
                            <option>MM/DD/YYYY</option>
                            <option>DD/MM/YYYY</option>
                            <option>YYYY-MM-DD</option>
                        </select>
                    </div>
                </div>
                
                <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--v-border); display: flex; justify-content: flex-end;">
                    <app-button variant="primary" (onClick)="saveChanges()">Save Changes</app-button>
                </div>
            </app-card>
        </div>
    </div>
</div>
