<button
  class="vrip-button"
  [ngClass]="[
    'vrip-btn-' + variant,
    'vrip-btn-' + size,
    block ? 'vrip-btn-block' : '',
    iconOnly ? 'vrip-btn-icon-only' : ''
  ]"
  [disabled]="disabled || loading"
  [type]="type"
  (click)="handleClick($event)">

</button>

<div class="placeholder-panel">
  <p>Awaiting the backend endpoint.</p>
  <div class="placeholder-row">
    <span>Orbit IT Systems</span>
    <span>Pending Approval</span>
    <span class="placeholder-tag">pending</span>
  </div>
  <div class="placeholder-row">
    <span>Delta Logistics</span>
    <span>Under Review</span>
    <span class="placeholder-tag">pending</span>
  </div>
  <div class="placeholder-row">
    <span>Ashcroft Maintenance</span>
    <span>Inactive</span>
    <span class="placeholder-tag">pending</span>
  </div>
</div>
