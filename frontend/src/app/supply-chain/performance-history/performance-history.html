<div class="page-container">
    <div class="page-vrip-page-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--vrip-space-6);">
        <div>
            <h1 class="vrip-page-title">Performance History</h1>
            <p style="color: var(--text-secondary); margin-top: 4px;">Review long-term vendor performance across multiple procurement cycles.</p>
        </div>
        <div style="display: flex; gap: 8px;">
            <app-button variant="outline" size="sm" iconLeft="refresh" (onClick)="loadVendorsAndHistory()">Refresh</app-button>
        </div>
    </div>

    <app-card [noPadding]="true">
        <div style="padding: 16px 24px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 16px;">
            <label style="font-weight: 500; font-size: 0.875rem;">Filter by Vendor:</label>
            <select [(ngModel)]="selectedVendorId" (change)="onVendorSelect(selectedVendorId)" class="vrip-select" style="width: 260px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-color);">
                <option value="all">All Vendors</option>
                <option *ngFor="let v of vendorsList" [value]="v.id">{{ v.name }}</option>
            </select>
        </div>

        <div *ngIf="isLoading" style="padding: 40px; text-align: center; color: var(--text-secondary);">
            Loading vendor performance cycles...
        </div>

        <app-table
            *ngIf="!isLoading"
            [columns]="columns"
            [data]="history">
        </app-table>
    </app-card>
</div>
