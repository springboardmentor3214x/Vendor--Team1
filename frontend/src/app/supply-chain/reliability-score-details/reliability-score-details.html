<div class="page-container">
    <div style="margin-bottom: var(--vrip-space-4);">
        <a routerLink="/supply-chain/vendor-reliability-dashboard" style="color: var(--vrip-primary); text-decoration: none; font-size: 0.875rem; font-weight: 500; display: flex; align-items: center; gap: 4px;">
            <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span>
            Back to Dashboard
        </a>
    </div>
    <div class="page-vrip-page-header" style="margin-bottom: var(--vrip-space-6); display: flex; justify-content: space-between; align-items: flex-end;">
        <div>
            <h1 class="vrip-page-title">Reliability Score Details</h1>
            <p style="font-size: 1.1rem;"><strong>{{ vendorName }}</strong></p>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px;">
            <div style="font-size: 0.875rem; color: var(--text-secondary);">Overall Score</div>
            <div style="font-size: 2rem; font-weight: 700; color: #007aff;">{{ overallScore }}%</div>
            <span class="vrip-badge" [ngStyle]="{'background': riskLevel === 'Low' ? 'rgba(52, 199, 89, 0.1)' : 'rgba(255, 59, 48, 0.1)', 'color': riskLevel === 'Low' ? '#34c759' : '#ff3b30'}">{{ riskLevel }} Risk</span>
        </div>
    </div>

</div>

<div class="placeholder-panel">
  <p>Live data is not connected yet.</p>
  <div class="placeholder-row">
    <span>Northwind Steel</span>
    <span>Active</span>
  </div>
  <div class="placeholder-row">
    <span>Orbit IT Systems</span>
    <span>Pending Approval</span>
  </div>
  <div class="placeholder-row">
    <span>Delta Logistics</span>
    <span>Under Review</span>
  </div>
  <div class="placeholder-row">
    <span>Ashcroft Maintenance</span>
    <span>Inactive</span>
  </div>
</div>
