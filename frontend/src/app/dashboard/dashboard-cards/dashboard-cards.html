<div class="cards-grid">

    <ng-container *ngIf="loading">
        <div class="vrip-stat-card border-primary" *ngFor="let _ of [1,2,3,4]">
            <div class="stat-header">
                <div class="skeleton-text" style="width: 65%;"></div>
                <div class="skeleton-avatar" style="width: 20px; height: 20px; border-radius: 4px;"></div>
            </div>
            <div class="skeleton-number"></div>
            <div class="skeleton-text" style="width: 45%; height: 10px; margin-top: 4px;"></div>
        </div>
    </ng-container>

</div>
